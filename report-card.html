<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Report Card | LUNHS</title><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell"><div class="v32-toolbar"><a class="app-btn secondary" href="dashboard.html">Back</a><button class="app-btn" onclick="print()">Print / Save PDF</button></div><section class="app-card"><div style="text-align:center"><img src="lunhs-logo.png" style="width:75px"><h2>La Union National High School</h2><h3>Digital Academic Report</h3></div><div id="student"></div><div class="table-wrap"><table class="v32-table"><thead><tr><th>Subject</th><th>Term 1</th><th>Term 2</th><th>Term 3</th><th>Average</th></tr></thead><tbody id="rows"></tbody></table></div><h3 id="overall"></h3></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(LUNHS_CONFIG.url,LUNHS_CONFIG.key);(async()=>{let {data:{user}}=await sb.auth.getUser();if(!user)return location.href="portal.html";let {data:p}=await sb.from("profiles").select("*").eq("id",user.id).single();if(p?.role!=="student")return location.href="dashboard.html";let {data:y}=await sb.from("school_years").select("label").eq("is_active",true).maybeSingle(),sy=y?.label||"2026-2027";student.innerHTML=`<p><b>${p.display_name}</b><br>LRN/School ID: ${p.school_id||""}<br>Grade ${p.grade_level||""} • ${p.section||""}<br>School Year: ${sy}</p>`;let {data:g}=await sb.from("grades").select("term1,term2,term3,subjects(name)").eq("student_id",user.id).eq("school_year",sy);let finals=[];rows.innerHTML=(g||[]).map(x=>{let a=[x.term1,x.term2,x.term3].filter(v=>v!==null).map(Number),av=a.length===3?a.reduce((q,w)=>q+w,0)/3:null;if(av!==null)finals.push(av);return `<tr><td>${x.subjects?.name||"Subject"}</td><td>${x.term1??"—"}</td><td>${x.term2??"—"}</td><td>${x.term3??"—"}</td><td>${av===null?"—":av.toFixed(2)}</td></tr>`}).join("");overall.textContent=finals.length?"Overall Average: "+(finals.reduce((a,b)=>a+b,0)/finals.length).toFixed(2):""})();</script></body></html>
