<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Search | LUNHS</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"></head><body><header class="reference-header"><div class="brand"><img src="lunhs-logo.png"><b>La Union National High School</b></div><nav><a href="index.html">Home</a><a href="announcements.html">News</a><a href="calendar.html">Calendar</a><a href="resources.html">Resources</a><a href="portal.html">Portal Login</a></nav></header><main class="app-shell"><h1 class="app-page-title">Search LUNHS</h1><input id="q" class="app-input" placeholder="Search announcements, publications and resources…"><div id="results" class="search-results"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(LUNHS_CONFIG.url,LUNHS_CONFIG.key),q=document.getElementById("q"),o=document.getElementById("results");let timer;q.oninput=()=>{clearTimeout(timer);timer=setTimeout(run,250)};async function run(){let x=q.value.trim();if(x.length<2){o.innerHTML="";return}let [{data:p},{data:r}]=await Promise.all([sb.from("posts").select("title,body,type,category,media_url").eq("published",true).ilike("title","%"+x+"%").limit(20),sb.from("school_resources").select("title,description,url").ilike("title","%"+x+"%").limit(20)]);o.innerHTML=[...(p||[]).map(a=>`<div class="search-result"><b>${a.title}</b><p>${a.body||""}</p></div>`),...(r||[]).map(a=>`<div class="search-result"><b>${a.title}</b><p>${a.description||""}</p><a href="${a.url}" target="_blank">Open</a></div>`)].join("")||"<p>No matching results.</p>"}</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));</script>
<script>
window.addEventListener("load",()=>{setTimeout(()=>document.getElementById("lunhsSplash")?.classList.add("hide"),450)});
</script>
<div id="lunhsSplash" class="splash-screen"><img src="lunhs-logo.png" alt="LUNHS"><b>La Union National High School</b><small>School Information Portal</small></div>
