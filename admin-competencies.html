<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competency Monitoring | LUNHS</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.tbl{overflow:auto}.tbl table{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.low{font-weight:800}</style></head><body><main class="standalone-page"><a href="admin.html">← Admin</a><h1>Least Learned Competency Monitoring</h1><div class="app-card"><label>Least-Learned Threshold (%) <input id="threshold" type="number" min="1" max="100"></label><button id="saveThreshold">Save Threshold</button><label>School Year <select id="sy"></select></label><button id="load">Load</button><p id="msg"></p></div><div class="app-card tbl"><table><thead><tr><th>Teacher</th><th>Subject</th><th>Section</th><th>Term</th><th>Assessment</th><th>Competency</th><th>Mastery</th><th>Intervention</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="config.js"></script><script>
const sb=supabase.createClient(LUNHS_CONFIG.url,LUNHS_CONFIG.key),$=x=>document.getElementById(x),E=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));let threshold=60;
async function init(){let u=(await sb.auth.getUser()).data.user;if(!u)return location.href="portal.html";let p=(await sb.from("profiles").select("role").eq("id",u.id).single()).data;if(p?.role!=="admin")return location.href="dashboard.html";let y=await sb.from("school_years").select("*").order("label",{ascending:false});$("sy").innerHTML=(y.data||[]).map(x=>`<option ${x.is_active?"selected":""}>${E(x.label)}</option>`).join("");let s=await sb.from("competency_settings").select("numeric_value").eq("setting_key","least_learned_threshold").single();threshold=Number(s.data?.numeric_value??60);$("threshold").value=threshold;load()}
async function load(){threshold=Number($("threshold").value||60);let r=await sb.from("competency_assessments").select("*,profiles!competency_assessments_teacher_id_fkey(display_name),subjects(name,grade_level)").eq("school_year",$("sy").value).order("mastery_percent");if(r.error)return $("msg").textContent=r.error.message;$("rows").innerHTML=(r.data||[]).map(x=>`<tr class="${Number(x.mastery_percent)<threshold?"low":""}"><td>${E(x.profiles?.display_name)}</td><td>${E(x.subjects?.name)}</td><td>${E(x.section)}</td><td>${E(x.term)}</td><td>${E(x.assessment_title)}</td><td>${E(x.competency)}</td><td>${Number(x.mastery_percent).toFixed(2)}%</td><td>${E(x.intervention||"")}</td><td>${E(x.intervention_status)}</td></tr>`).join("")||'<tr><td colspan="9">No records.</td></tr>'}
$("saveThreshold").onclick=async()=>{let n=Number($("threshold").value);if(n<1||n>100)return $("msg").textContent="Threshold must be 1–100.";let r=await sb.from("competency_settings").update({numeric_value:n,updated_at:new Date().toISOString()}).eq("setting_key","least_learned_threshold");$("msg").textContent=r.error?r.error.message:"Threshold saved.";threshold=n};$("load").onclick=load;init();
</script></body></html>
