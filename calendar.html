<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>School Calendar | LUNHS</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"></head><body><header class="reference-header"><div class="brand"><img src="lunhs-logo.png"><b>La Union National High School</b></div><nav><a href="index.html">Home</a><a href="announcements.html">News</a><a href="calendar.html">Calendar</a><a href="resources.html">Resources</a><a href="portal.html">Portal Login</a></nav></header><main class="app-shell"><h1 class="app-page-title">School Calendar</h1><p class="app-muted">School activities, examinations, deadlines and important dates.</p><div id="events" class="calendar-list"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(LUNHS_CONFIG.url,LUNHS_CONFIG.key);(async()=>{const {data}=await sb.from("school_events").select("*").order("event_date");document.getElementById("events").innerHTML=(data||[]).map(e=>`<div class="calendar-item"><b>${e.title}</b><div>${new Date(e.event_date+"T00:00:00").toLocaleDateString()}${e.location?" • "+e.location:""}</div><small>${e.description||""}</small></div>`).join("")||"<p>No calendar events posted yet.</p>"})();</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));</script>
<script>
window.addEventListener("load",()=>{setTimeout(()=>document.getElementById("lunhsSplash")?.classList.add("hide"),450)});
</script>
