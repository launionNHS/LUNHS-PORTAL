<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Year Setup | LUNHS</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:grid;grid-template-columns:2fr 1fr 2fr 1fr;gap:8px;padding:8px;border-bottom:1px solid #ddd}
.load-form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.load-form label{font-size:.88rem;font-weight:700}.load-form select{width:100%;margin-top:4px}
.load-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.load-list{margin-top:14px}.load-item{display:grid;grid-template-columns:1.5fr 1fr auto;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #ddd}
.load-item small{display:block;opacity:.75}.teacher-summary{padding:8px 10px;margin-top:10px;background:#eef6f1;border-left:4px solid #176b45}.danger{background:#fff1f1!important;color:#8b1d1d!important}
@media(max-width:700px){.g,.row,.load-form,.load-item{grid-template-columns:1fr}}
</style></head><body><main class="standalone-page"><a href="admin.html">← Admin</a><h1>School Year Setup & Rollover</h1><div class="app-card"><select id="sy"></select> <button id="newsy">Create School Year</button> <button id="active" class="primary">Make Active</button><p id="msg"></p></div><div class="g">
<div class="app-card"><h3>1. Sections & Advisers</h3><input id="grade" class="app-input" placeholder="Grade level"><input id="section" class="app-input" placeholder="Section"><select id="adviser"></select><button id="addsec">Add Section</button><div id="sections"></div></div>
<div class="app-card"><h3>2. Subjects</h3><input id="subname" class="app-input" placeholder="Subject"><input id="subgrade" class="app-input" placeholder="Grade level"><button id="addsub">Add Subject</button><div id="subjects"></div></div>

<div class="app-card"><h3>3. Teacher Loads</h3>
<p>Select a teacher and grade level first. Subjects and sections will be filtered automatically.</p>
<div class="load-form">
<label>Teacher<select id="teacher"></select></label>
<label>Grade Level<select id="loadgrade"></select></label>
<label>Subject<select id="subjectsel"></select></label>
<label>Section<select id="sectionsel"></select></label><label>Term<select id="loadterm"><option>All Terms</option><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></label>
</div>
<div class="load-actions"><button id="addload" class="primary">+ Assign Teacher</button></div>
<div id="loadmsg"></div><div id="teacherSummary"></div><div id="loads" class="load-list"></div>
</div>

<div class="app-card"><h3>4. Student Promotion / Placement</h3><select id="fg"></select><select id="fs"></select><button id="loadstudents">Load Students</button><div id="studentrows"></div><button id="savestudents" class="primary" hidden>Save Placements</button></div></div></main>
<script src="config.js"></script><script>
const sb=supabase.createClient(LUNHS_CONFIG.url,LUNHS_CONFIG.key),$=x=>document.getElementById(x);let Y=[],S=[],T=[],U=[],C=[],LOADS=[];const e=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function init(){let u=(await sb.auth.getUser()).data.user;if(!u)return location.href="portal.html";let p=(await sb.from("profiles").select("role").eq("id",u.id).single()).data;if(p?.role!=="admin")return location.href="dashboard.html";refresh()}
async function refresh(){let r=await Promise.all([sb.from("school_years").select("*").order("label",{ascending:false}),sb.from("profiles").select("id,display_name,grade_level,section,sex").eq("role","student"),sb.from("profiles").select("id,display_name").eq("role","teacher").order("display_name"),sb.from("subjects").select("*").order("grade_level").order("name"),sb.from("school_sections").select("*").order("grade_level").order("section_name")]);Y=r[0].data||[];S=r[1].data||[];T=r[2].data||[];U=r[3].data||[];C=r[4].data||[];$("sy").innerHTML=Y.map(x=>`<option ${x.is_active?"selected":""}>${e(x.label)}${x.is_active?" (ACTIVE)":""}</option>`).join("");fill();await render()}
function sy(){return $("sy").value.replace(" (ACTIVE)","")}
function gradesForLoads(){return [...new Set([...U.map(x=>String(x.grade_level||"").trim()),...C.filter(x=>x.school_year===sy()).map(x=>String(x.grade_level||"").trim())].filter(Boolean))].sort((a,b)=>Number(a)-Number(b)||a.localeCompare(b))}
function fill(){
 let cs=C.filter(x=>x.school_year===sy());
 $("adviser").innerHTML='<option value="">No adviser</option>'+T.map(x=>`<option value="${x.id}">${e(x.display_name)}</option>`).join("");
 let oldTeacher=$("teacher").value;$("teacher").innerHTML='<option value="">Choose teacher</option>'+T.map(x=>`<option value="${x.id}">${e(x.display_name)}</option>`).join("");if(T.some(x=>x.id===oldTeacher))$("teacher").value=oldTeacher;
 let oldGrade=$("loadgrade").value;$("loadgrade").innerHTML='<option value="">Choose grade</option>'+gradesForLoads().map(x=>`<option value="${e(x)}">Grade ${e(x)}</option>`).join("");if(gradesForLoads().includes(oldGrade))$("loadgrade").value=oldGrade;
 filterLoadChoices();
 let gs=[...new Set(S.map(x=>x.grade_level).filter(Boolean))],ss=[...new Set(S.map(x=>x.section).filter(Boolean))];$("fg").innerHTML='<option value="">All Grades</option>'+gs.map(x=>`<option>${e(x)}</option>`).join("");$("fs").innerHTML='<option value="">All Sections</option>'+ss.map(x=>`<option>${e(x)}</option>`).join("")
}
function filterLoadChoices(){
 let g=$("loadgrade").value,cs=C.filter(x=>x.school_year===sy()&&(!g||String(x.grade_level)===g)),subs=U.filter(x=>!g||String(x.grade_level||"")===g);
 $("subjectsel").innerHTML='<option value="">Choose subject</option>'+subs.map(x=>`<option value="${x.id}">${e(x.name)}</option>`).join("");
 $("sectionsel").innerHTML='<option value="">Choose section</option>'+cs.map(x=>`<option value="${e(x.section_name)}">${e(x.section_name)}</option>`).join("")
}
async function render(){
 $("sections").innerHTML=C.filter(x=>x.school_year===sy()).map(x=>`<p>G${e(x.grade_level)} — <b>${e(x.section_name)}</b></p>`).join("");
 $("subjects").innerHTML=U.map(x=>`<p>G${e(x.grade_level||"")} — <b>${e(x.name)}</b></p>`).join("");
 let r=await sb.from("teacher_assignments").select("id,teacher_id,subject_id,section,school_year,term,profiles!teacher_assignments_teacher_id_fkey(display_name),subjects(name,grade_level)").eq("school_year",sy()).order("section");
 if(r.error){$("loadmsg").textContent=r.error.message;return}
 LOADS=r.data||[];renderLoads()
}
function renderLoads(){
 let tid=$("teacher").value,list=tid?LOADS.filter(x=>x.teacher_id===tid):LOADS;
 let tn=T.find(x=>x.id===tid)?.display_name;
 $("teacherSummary").innerHTML=tid?`<div class="teacher-summary"><b>${e(tn)}</b> has ${list.length} load${list.length===1?"":"s"} for ${e(sy())}.</div>`:`<div class="teacher-summary">Showing all ${LOADS.length} teacher load${LOADS.length===1?"":"s"} for ${e(sy())}. Select a teacher to focus the list.</div>`;
 $("loads").innerHTML=list.sort((a,b)=>String(a.subjects?.grade_level||"").localeCompare(String(b.subjects?.grade_level||""))||String(a.subjects?.name||"").localeCompare(String(b.subjects?.name||""))||String(a.section).localeCompare(String(b.section))).map(x=>`<div class="load-item"><div><b>${e(x.profiles?.display_name||"Teacher")}</b><small>Grade ${e(x.subjects?.grade_level||"")} • ${e(x.subjects?.name||"Subject")}</small></div><div>${e(x.section)}<small><b>${e(x.term||"All Terms")}</b></small></div><button class="danger" type="button" onclick="removeLoad(${x.id})">Remove</button></div>`).join("")||"<p>No teacher loads found.</p>"
}
async function removeLoad(id){
 let x=LOADS.find(a=>a.id===id);if(!x)return;
 if(!confirm(`Remove ${x.subjects?.name||"this subject"} — ${x.section} from ${x.profiles?.display_name||"teacher"}?`))return;
 let r=await sb.from("teacher_assignments").delete().eq("id",id);$("loadmsg").textContent=r.error?r.error.message:"Teacher load removed.";if(!r.error)await render()
}
$("newsy").onclick=async()=>{let x=prompt("Example: 2027-2028");if(!x)return;let r=await sb.from("school_years").insert({label:x,is_active:false});$("msg").textContent=r.error?r.error.message:"Created.";if(!r.error)refresh()};
$("active").onclick=async()=>{if(!confirm("Activate "+sy()+"?"))return;await sb.from("school_years").update({is_active:false}).neq("label","");let r=await sb.from("school_years").update({is_active:true}).eq("label",sy());$("msg").textContent=r.error?r.error.message:"Active school year changed.";refresh()};
$("addsec").onclick=async()=>{let r=await sb.from("school_sections").insert({school_year:sy(),grade_level:$("grade").value,section_name:$("section").value,adviser_id:$("adviser").value||null});$("msg").textContent=r.error?r.error.message:"Section added.";refresh()};
$("addsub").onclick=async()=>{let r=await sb.from("subjects").insert({name:$("subname").value,grade_level:$("subgrade").value});$("msg").textContent=r.error?r.error.message:"Subject added.";refresh()};
$("loadgrade").onchange=filterLoadChoices;
$("teacher").onchange=renderLoads;
$("addload").onclick=async()=>{
 let teacher_id=$("teacher").value,subject_id=+$("subjectsel").value,section=$("sectionsel").value,term=$("loadterm").value;
 if(!teacher_id)return $("loadmsg").textContent="Please choose a teacher.";
 if(!$("loadgrade").value)return $("loadmsg").textContent="Please choose a grade level.";
 if(!subject_id)return $("loadmsg").textContent="Please choose a subject.";
 if(!section)return $("loadmsg").textContent="Please choose a section.";
 let conflict=LOADS.find(x=>x.subject_id===subject_id&&x.section===section&&x.school_year===sy()&&
   (term==="All Terms"||x.term==="All Terms"||x.term===term));
 if(conflict)return $("loadmsg").textContent=`This class already has ${conflict.profiles?.display_name||"a teacher"} assigned for ${conflict.term||"All Terms"}. Remove that load first if you want to change the teacher.`;
 let r=await sb.from("teacher_assignments").insert({teacher_id,subject_id,section,school_year:sy(),term});
 $("loadmsg").textContent=r.error?r.error.message:`Teacher assigned successfully for ${term}.`;
 if(!r.error)await render()
};

function nameParts(name){let n=String(name||"").trim();if(n.includes(",")){let p=n.split(",");return {surname:(p[0]||"").trim(),first:(p.slice(1).join(",")||"").trim()}}let p=n.split(/\s+/).filter(Boolean);return {surname:(p[p.length-1]||""),first:(p.slice(0,-1).join(" ")||"")}}
function alphaStudent(a,b){let A=nameParts(a.display_name),B=nameParts(b.display_name);return A.surname.localeCompare(B.surname,undefined,{sensitivity:"base"})||A.first.localeCompare(B.first,undefined,{sensitivity:"base"})}
function sexRank(s){return s==="Male"?0:s==="Female"?1:2}
function studentGroupLabel(sex){return sex==="Male"?"MALE":sex==="Female"?"FEMALE":"SEX NOT SET"}
$("loadstudents").onclick=()=>{let g=$("fg").value,s=$("fs").value,cs=C.filter(x=>x.school_year===sy());let list=S.filter(x=>(!g||x.grade_level===g)&&(!s||x.section===s)).sort((a,b)=>sexRank(a.sex)-sexRank(b.sex)||alphaStudent(a,b));let out="",last=null;for(const x of list){let group=studentGroupLabel(x.sex);if(group!==last){out+=`<div style="margin:16px 0 6px;padding:8px 10px;font-weight:800;background:#eef6f1;border-left:4px solid #176b45">${group}</div>`;last=group}out+=`<div class="row" data-id="${x.id}"><b>${e(x.display_name)}</b><span>G${e(x.grade_level)} ${e(x.section)}</span><select class="place"><option value="">Choose new class</option>${cs.map(c=>`<option value="${e(c.grade_level)}|${e(c.section_name)}">G${e(c.grade_level)} — ${e(c.section_name)}</option>`).join("")}</select><select class="status"><option>Enrolled</option><option>Promoted</option><option>Retained</option><option>Transferred In</option><option>Transferred Out</option><option>Dropped</option><option>No Longer in School</option></select></div>`}$("studentrows").innerHTML=out||"No students found.";$("savestudents").hidden=!list.length};
$("savestudents").onclick=async()=>{for(const r of document.querySelectorAll(".row")){let old=S.find(x=>x.id===r.dataset.id),v=r.querySelector(".place").value,status=r.querySelector(".status").value,g=old.grade_level,s=old.section;if(v)[g,s]=v.split("|");let q=await sb.from("student_enrollments").upsert({student_id:r.dataset.id,school_year:sy(),grade_level:g,section:s,status},{onConflict:"student_id,school_year"});if(q.error)return $("msg").textContent=q.error.message;if(v&&!["Transferred Out","Dropped","No Longer in School"].includes(status)){q=await sb.from("profiles").update({grade_level:g,section:s}).eq("id",r.dataset.id);if(q.error)return $("msg").textContent=q.error.message}}$("msg").textContent="Student placements saved; old history preserved.";refresh()};
$("sy").onchange=()=>{fill();render()};init();
</script></body></html>
