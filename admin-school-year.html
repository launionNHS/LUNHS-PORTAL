<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Year Setup | LUNHS</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:grid;grid-template-columns:2fr 1fr 2fr 1fr;gap:8px;padding:8px;border-bottom:1px solid #ddd}@media(max-width:700px){.g,.row{grid-template-columns:1fr}}</style></head><body><main class="standalone-page"><a href="admin.html">← Admin</a><h1>School Year Setup & Rollover</h1><div class="app-card"><select id="sy"></select> <button id="newsy">Create School Year</button> <button id="active" class="primary">Make Active</button><p id="msg"></p></div><div class="g">
<div class="app-card"><h3>1. Sections & Advisers</h3><input id="grade" class="app-input" placeholder="Grade level"><input id="section" class="app-input" placeholder="Section"><select id="adviser"></select><button id="addsec">Add Section</button><div id="sections"></div></div>
<div class="app-card"><h3>2. Subjects</h3><input id="subname" class="app-input" placeholder="Subject"><input id="subgrade" class="app-input" placeholder="Grade level"><button id="addsub">Add Subject</button><div id="subjects"></div></div>
<div class="app-card"><h3>3. Teacher Loads</h3><select id="teacher"></select><select id="subjectsel"></select><select id="sectionsel"></select><button id="addload">Assign</button><div id="loads"></div></div>
<div class="app-card"><h3>4. Student Promotion / Placement</h3><select id="fg"></select><select id="fs"></select><button id="loadstudents">Load Students</button><div id="studentrows"></div><button id="savestudents" class="primary" hidden>Save Placements</button></div></div></main>
<script src="config.js"></script><script>
const sb=supabase.createClient(LUNHS_CONFIG.url,LUNHS_CONFIG.key),$=x=>document.getElementById(x);let Y=[],S=[],T=[],U=[],C=[];const e=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
async function init(){let u=(await sb.auth.getUser()).data.user;if(!u)return location.href="portal.html";let p=(await sb.from("profiles").select("role").eq("id",u.id).single()).data;if(p?.role!=="admin")return location.href="dashboard.html";refresh()}
async function refresh(){let r=await Promise.all([sb.from("school_years").select("*").order("label",{ascending:false}),sb.from("profiles").select("id,display_name,grade_level,section").eq("role","student"),sb.from("profiles").select("id,display_name").eq("role","teacher"),sb.from("subjects").select("*"),sb.from("school_sections").select("*")]);Y=r[0].data||[];S=r[1].data||[];T=r[2].data||[];U=r[3].data||[];C=r[4].data||[];$("sy").innerHTML=Y.map(x=>`<option ${x.is_active?"selected":""}>${e(x.label)}${x.is_active?" (ACTIVE)":""}</option>`).join("");fill();render()}
function sy(){return $("sy").value.replace(" (ACTIVE)","")} function fill(){let cs=C.filter(x=>x.school_year===sy());$("adviser").innerHTML='<option value="">No adviser</option>'+T.map(x=>`<option value="${x.id}">${e(x.display_name)}</option>`).join("");$("teacher").innerHTML=T.map(x=>`<option value="${x.id}">${e(x.display_name)}</option>`).join("");$("subjectsel").innerHTML=U.map(x=>`<option value="${x.id}">${e(x.name)} — G${e(x.grade_level||"")}</option>`).join("");$("sectionsel").innerHTML=cs.map(x=>`<option value="${e(x.section_name)}">G${e(x.grade_level)} — ${e(x.section_name)}</option>`).join("");let gs=[...new Set(S.map(x=>x.grade_level).filter(Boolean))],ss=[...new Set(S.map(x=>x.section).filter(Boolean))];$("fg").innerHTML='<option value="">All Grades</option>'+gs.map(x=>`<option>${e(x)}</option>`).join("");$("fs").innerHTML='<option value="">All Sections</option>'+ss.map(x=>`<option>${e(x)}</option>`).join("")}
async function render(){$("sections").innerHTML=C.filter(x=>x.school_year===sy()).map(x=>`<p>G${e(x.grade_level)} — <b>${e(x.section_name)}</b></p>`).join("");$("subjects").innerHTML=U.map(x=>`<p>G${e(x.grade_level||"")} — <b>${e(x.name)}</b></p>`).join("");let r=await sb.from("teacher_assignments").select("id,section,profiles!teacher_assignments_teacher_id_fkey(display_name),subjects(name,grade_level)").eq("school_year",sy());$("loads").innerHTML=(r.data||[]).map(x=>`<p><b>${e(x.profiles?.display_name)}</b>: ${e(x.subjects?.name)} / ${e(x.section)}</p>`).join("")}
$("newsy").onclick=async()=>{let x=prompt("Example: 2027-2028");if(!x)return;let r=await sb.from("school_years").insert({label:x,is_active:false});$("msg").textContent=r.error?r.error.message:"Created.";if(!r.error)refresh()};$("active").onclick=async()=>{if(!confirm("Activate "+sy()+"?"))return;await sb.from("school_years").update({is_active:false}).neq("label","");let r=await sb.from("school_years").update({is_active:true}).eq("label",sy());$("msg").textContent=r.error?r.error.message:"Active school year changed.";refresh()};
$("addsec").onclick=async()=>{let r=await sb.from("school_sections").insert({school_year:sy(),grade_level:$("grade").value,section_name:$("section").value,adviser_id:$("adviser").value||null});$("msg").textContent=r.error?r.error.message:"Section added.";refresh()};$("addsub").onclick=async()=>{let r=await sb.from("subjects").insert({name:$("subname").value,grade_level:$("subgrade").value});$("msg").textContent=r.error?r.error.message:"Subject added.";refresh()};$("addload").onclick=async()=>{let r=await sb.from("teacher_assignments").insert({teacher_id:$("teacher").value,subject_id:+$("subjectsel").value,section:$("sectionsel").value,school_year:sy()});$("msg").textContent=r.error?r.error.message:"Teacher load added.";render()};
$("loadstudents").onclick=()=>{let g=$("fg").value,s=$("fs").value,cs=C.filter(x=>x.school_year===sy()),list=S.filter(x=>(!g||x.grade_level===g)&&(!s||x.section===s));$("studentrows").innerHTML=list.map(x=>`<div class="row" data-id="${x.id}"><b>${e(x.display_name)}</b><span>G${e(x.grade_level)} ${e(x.section)}</span><select class="place"><option value="">Choose new class</option>${cs.map(c=>`<option value="${e(c.grade_level)}|${e(c.section_name)}">G${e(c.grade_level)} — ${e(c.section_name)}</option>`).join("")}</select><select class="status"><option>Enrolled</option><option>Retained</option><option>Transferred Out</option><option>Dropped</option><option>Graduated</option><option>Inactive</option></select></div>`).join("");$("savestudents").hidden=!list.length};$("savestudents").onclick=async()=>{for(const r of document.querySelectorAll(".row")){let old=S.find(x=>x.id===r.dataset.id),v=r.querySelector(".place").value,status=r.querySelector(".status").value,g=old.grade_level,s=old.section;if(v)[g,s]=v.split("|");let q=await sb.from("student_enrollments").upsert({student_id:r.dataset.id,school_year:sy(),grade_level:g,section:s,status},{onConflict:"student_id,school_year"});if(q.error)return $("msg").textContent=q.error.message;if(v&&!["Transferred Out","Dropped","Graduated","Inactive"].includes(status)){q=await sb.from("profiles").update({grade_level:g,section:s}).eq("id",r.dataset.id);if(q.error)return $("msg").textContent=q.error.message}}$("msg").textContent="Student placements saved; old history preserved.";refresh()};$("sy").onchange=()=>{fill();render()};init();
</script></body></html>
