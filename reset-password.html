<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUNHS - Set New Password</title>
<link rel="stylesheet" href="styles.css">
<style>
.recovery-wrap{max-width:520px;margin:8vh auto;padding:24px}
.recovery-card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.12)}
.recovery-card input{width:100%;box-sizing:border-box;margin:8px 0 14px;padding:12px}
.recovery-card button{width:100%;padding:12px}
#msg{margin-top:12px}
</style>
</head>
<body>
<main class="recovery-wrap">
<section class="recovery-card">
<h1>Set New Password</h1>
<p>Enter a new password for your LUNHS Administrator account.</p>
<form id="resetForm">
<label>New Password
<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
</label>
<label>Confirm New Password
<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
</label>
<button type="submit">Update Password</button>
</form>
<div id="msg"></div>
<p><a href="./">Return to LUNHS Portal</a></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const C=window.LUNHS_CONFIG;
const sb=supabase.createClient(C.url,C.key);
const msg=document.getElementById('msg');

sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY') {
    msg.textContent='Recovery link verified. Enter your new password.';
  }
});

document.getElementById('resetForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const p=document.getElementById('newPassword').value;
  const c=document.getElementById('confirmPassword').value;
  if(p.length<8){msg.textContent='Password must be at least 8 characters.';return;}
  if(p!==c){msg.textContent='Passwords do not match.';return;}
  msg.textContent='Updating password...';
  const {error}=await sb.auth.updateUser({password:p});
  if(error){msg.textContent=error.message;return;}
  msg.textContent='Password updated successfully. You can now return to the portal and sign in.';
  setTimeout(async()=>{ await sb.auth.signOut(); window.location.href='./'; },1800);
});
</script>
</body>
</html>
