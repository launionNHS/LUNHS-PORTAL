<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Trail | LUNHS</title><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell"><a href="admin.html">← Management</a><h1 class="app-page-title">Audit Trail</h1><div class="table-wrap"><table class="v32-table"><thead><tr><th>Date</th><th>Action</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const sb=supabase.createClient(LUNHS_CONFIG.url,LUNHS_CONFIG.key);(async()=>{let {data:{user}}=await sb.auth.getUser();if(!user)return location.href="portal.html";let {data:p}=await sb.from("profiles").select("role").eq("id",user.id).single();if(p?.role!=="admin")return location.href="dashboard.html";let {data}=await sb.from("audit_log").select("*").order("created_at",{ascending:false}).limit(200);rows.innerHTML=(data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.action}</td><td>${x.details||""}</td></tr>`).join("")})();</script></body></html>
