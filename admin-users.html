<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Accounts | LUNHS</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class="reference-header"><div class="brand"><img src="lunhs-logo.png"><div><b>La Union National High School</b><small>ACCOUNT MANAGEMENT</small></div></div><nav><a href="dashboard.html">Dashboard</a><a href="admin-cms.html">Website Manager</a></nav></header>
<main class="standalone-page"><section class="page-hero"><span>ADMINISTRATION</span><h1>Student & Teacher Accounts</h1><p>Create portal accounts and assign teachers to subjects and sections.</p></section><section class="page-content"><p id="status">Checking access…</p><div id="body" hidden>
<div class="cms-grid"><section class="cms-box"><h2>Create Account</h2>
<label>Role<select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select></label>
<label>Full Name<input id="name"></label><label>School ID / LRN / Employee ID<input id="schoolId"></label>
<label id="gradeLabel">Grade Level<input id="grade"></label><label id="sectionLabel">Section<input id="section"></label>
<label>Temporary Password<input id="pass" type="password" minlength="8"></label><button class="primary" id="create">Create Account</button><p id="createMsg"></p></section>
<section class="cms-box"><h2>Teacher Assignment</h2><label>Teacher<select id="teacher"></select></label><label>Subject<select id="subject"></select></label><label>Section<input id="assignSection"></label><button class="primary" id="assign">Assign Teacher</button><p id="assignMsg"></p></section></div>
<section class="cms-box"><h2>Existing Accounts</h2><div class="table-wrap"><table class="grade-table"><thead><tr><th>Name</th><th>Role</th><th>School ID</th><th>Grade</th><th>Section</th></tr></thead><tbody id="accounts"></tbody></table></div></section>
</div></section></main><script src="config.js"></script><script>
const sb=supabase.createClient(window.LUNHS_CONFIG.url,window.LUNHS_CONFIG.key),$=x=>document.getElementById(x);
async function init(){const u=(await sb.auth.getUser()).data.user;if(!u){location.href="portal.html";return}const p=(await sb.from("profiles").select("*").eq("id",u.id).single()).data;if(p?.role!=="admin"){$("status").textContent="Administrator access required.";return}$("status").textContent="Administrator: "+p.display_name;$("body").hidden=false;loadAll()}
$("role").onchange=()=>{let s=$("role").value==="student";$("gradeLabel").style.display=s?"block":"none";$("sectionLabel").style.display=s?"block":"none"};
$("create").onclick=async()=>{let role=$("role").value; $("createMsg").textContent="Creating…";const {data:{session}}=await sb.auth.getSession();const res=await fetch(window.LUNHS_CONFIG.url+"/functions/v1/create-school-user",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify({role,password:$("pass").value,display_name:$("name").value,school_id:$("schoolId").value,grade_level:role==="student"?$("grade").value:null,section:role==="student"?$("section").value:null})});let d={};try{d=await res.json()}catch(e){};$("createMsg").textContent=res.ok?"Account created successfully.":(d.error||d.message||"Unable to create account.");if(res.ok)loadAll()};
async function loadAll(){const {data}=await sb.from("profiles").select("*").in("role",["student","teacher"]).order("display_name");$("accounts").innerHTML=(data||[]).map(p=>`<tr><td>${p.display_name}</td><td>${p.role}</td><td>${p.school_id||""}</td><td>${p.grade_level||""}</td><td>${p.section||""}</td></tr>`).join("");$("teacher").innerHTML=(data||[]).filter(p=>p.role==="teacher").map(p=>`<option value="${p.id}">${p.display_name}</option>`).join("");const {data:s}=await sb.from("subjects").select("*").order("name");$("subject").innerHTML=(s||[]).map(x=>`<option value="${x.id}">${x.name}${x.grade_level?" — Grade "+x.grade_level:""}</option>`).join("")}
$("assign").onclick=async()=>{const {error}=await sb.from("teacher_assignments").upsert({teacher_id:$("teacher").value,subject_id:Number($("subject").value),section:$("assignSection").value.trim()},{onConflict:"teacher_id,subject_id,section"});$("assignMsg").textContent=error?error.message:"Teacher assigned successfully."};init();
</script></body></html>
