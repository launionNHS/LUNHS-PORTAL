<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>LUNHS Admin Password Recovery</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b5d35">
<link rel="apple-touch-icon" href="lunhs-logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LUNHS Portal">
</head>
<body><main style="max-width:520px;margin:8vh auto;padding:24px"><section class="card">
<h1>Administrator Password Recovery</h1>
<p>This page is for the Administrator recovery link sent by Supabase.</p>
<form id="f"><label>New Password<input id="p1" type="password" minlength="8" required></label>
<label>Confirm Password<input id="p2" type="password" minlength="8" required></label>
<button>Set New Password</button></form><p id="m"></p><p><a href="./">Return to portal</a></p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(LUNHS_CONFIG.url,LUNHS_CONFIG.key),m=document.getElementById('m');
document.getElementById('f').onsubmit=async e=>{
 e.preventDefault(); const a=p1.value,b=p2.value;
 if(a.length<8){m.textContent='Password must be at least 8 characters.';return}
 if(a!==b){m.textContent='Passwords do not match.';return}
 const {error}=await sb.auth.updateUser({password:a});
 if(error){m.textContent=error.message;return}
 m.textContent='Administrator password updated successfully.';
 setTimeout(async()=>{await sb.auth.signOut();location.href='./'},1600);
};
</script><button id="lunhsInstallApp" class="lunhs-install-app" hidden>Install LUNHS App</button>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"))}
let lunhsPrompt=null,installBtn=document.getElementById("lunhsInstallApp");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();lunhsPrompt=e;installBtn.hidden=false});
installBtn?.addEventListener("click",async()=>{if(!lunhsPrompt)return;lunhsPrompt.prompt();await lunhsPrompt.userChoice;lunhsPrompt=null;installBtn.hidden=true});
window.addEventListener("appinstalled",()=>{if(installBtn)installBtn.hidden=true});
</script></body></html>
