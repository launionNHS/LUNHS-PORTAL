<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Setup | LUNHS</title><link rel="stylesheet" href="styles.css"></head><body><main class="app-shell"><a href="admin.html">← Management</a><h1 class="app-page-title">Academic Setup</h1><div class="app-grid">
<form id="yearForm" class="app-card"><h3>School Year</h3><input name="label" class="app-input" placeholder="2027-2028" required><label><input type="checkbox" name="active"> Make active</label><button class="app-btn">Save School Year</button></form>
<form id="subjectForm" class="app-card"><h3>Add Subject</h3><input name="name" class="app-input" placeholder="Subject name" required><input name="grade" class="app-input" placeholder="Grade level"><button class="app-btn">Add Subject</button></form>
<div class="app-card"><h3>Existing School Years</h3><div id="years"></div></div></div><p id="msg"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=supabase.createClient(LUNHS_CONFIG.url,LUNHS_CONFIG.key),msg=document.getElementById("msg");async function guard(){let {data:{user}}=await sb.auth.getUser();if(!user)return location.href="portal.html";let {data:p}=await sb.from("profiles").select("role").eq("id",user.id).single();if(p?.role!=="admin")location.href="dashboard.html"}guard();
async function years(){let {data}=await sb.from("school_years").select("*").order("label",{ascending:false});document.getElementById("years").innerHTML=(data||[]).map(x=>`<p><b>${x.label}</b> ${x.is_active?'<span class="v32-badge">ACTIVE</span>':""}</p>`).join("")}
yearForm.onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),active=f.get("active")==="on";if(active)await sb.from("school_years").update({is_active:false}).neq("label","");let {error}=await sb.from("school_years").upsert({label:f.get("label"),is_active:active},{onConflict:"label"});msg.textContent=error?error.message:"School year saved.";years()};
subjectForm.onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let {error}=await sb.from("subjects").insert({name:f.get("name"),grade_level:f.get("grade")||null});msg.textContent=error?error.message:"Subject added.";if(!error)e.target.reset()};years();
</script></body></html>
